    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        var W = 1920, H = 1080;
        var cam = document.getElementById("cam");
        var cursor = document.getElementById("cursor");

        // frame point (cx, cy) at scale s, kept inside the footage
        function view(s, cx, cy) {
          var x = Math.min(0, Math.max(W - W * s, W / 2 - s * cx));
          var y = Math.min(0, Math.max(H - H * s, H / 2 - s * cy));
          return { scale: s, x: x, y: y };
        }
        gsap.set(cam, view(1, 960, 540));
        function move(at, s, cx, cy, d) {
          tl.to(cam, Object.assign(view(s, cx, cy), { duration: d || 0.9, ease: "power2.inOut" }), at);
        }
        function cut(at, s, cx, cy) {
          tl.set(cam, view(s, cx, cy), at);
        }

        // camera, in film seconds (footage.json has the source ranges)
        move(3.1, 1.7, 1550, 600); // ch1: the made-up answer
        move(8.8, 1.35, 620, 600, 1.1); // ch1: the eras

        move(27.4, 1.8, 1548, 850); // the grounded answer and its citation
        move(31.0, 1, 960, 540); // what reached the model
        cut(34.2, 1, 960, 540); // ch7
        move(37.6, 1.2, 700, 520, 3.4); // the whole pipeline

          var start = c.t - 0.45;

            tl.set(cursor, { x: c.x + 140, y: c.y + 110 }, start);

          tl.to(cursor, { scale: 0.84, duration: 0.07, ease: "power2.in" }, c.t - 0.03);

          r.className = "ripple";
          r.style.left = c.x + "px";
          r.style.top = c.y + "px";
          document.getElementById("ripples").appendChild(r);
          gsap.set(r, { autoAlpha: 0 });
          tl.fromTo(r, { scale: 0.2, autoAlpha: 1 }, { scale: 1.8, autoAlpha: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, c.t);
