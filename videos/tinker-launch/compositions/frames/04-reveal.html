    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["04-reveal"] = tl;

      const q = (sel) => document.querySelector('[data-composition-id="04-reveal"] ' + sel);
      const qa = (sel) => [...document.querySelectorAll('[data-composition-id="04-reveal"] ' + sel)];
      const kick = q("#kick"), ans = q("#ans");
      const tilesA = qa("#oA .tk"), tilesB = qa("#oB .tk");
      const numA = q("#oA .n b"), numB = q("#oB .n b");
      const stamp = q("#stamp");
      // The stamp is derived from the tile counts: 18/10 = +80%.
      stamp.textContent = "+" + Math.round((tilesB.length / tilesA.length - 1) * 100) + "%";

      // Scene 1 — discrete swap PREDICT → REVEAL, MORE TOKENS? → HINDI. (instant states, no smear)
      const SEQ = [
        { t: 0, k: "PREDICT", a: "More tokens?" },
        { t: 0.1, k: "", a: "" },
        { t: 0.18, k: "REVEAL", a: "Hi" },
        { t: 0.24, k: "REVEAL", a: "Hindi." },
      ];
      const stateAt = (t) => { for (let i = SEQ.length - 1; i >= 0; i--) if (t >= SEQ[i].t) return SEQ[i]; return SEQ[0]; };
      const drv = { t: 0 };
      const paint = () => { const s = stateAt(drv.t); kick.textContent = s.k; ans.textContent = s.a; };
      paint();
      tl.to(drv, { t: 0.55, duration: 0.55, ease: "none", onUpdate: paint }, 0);
      tl.fromTo(q("#oB"), { backgroundColor: "#FBF8F0" }, { backgroundColor: "#FFF1D2", duration: 0.4, ease: "power2.out" }, 0.15);

      // Tiles: colour wipe on the span backgrounds only (Devanagari spans get no transform/padding).
      const wipe = (tiles, at, stagger) => tiles.forEach((el, i) => {
        const c = el.style.backgroundColor;
        tl.fromTo(el, { backgroundColor: "rgba(255,255,255,0)" }, { backgroundColor: c, duration: 0.12, ease: "none", immediateRender: true }, at + i * stagger);
      });
      // counting-dynamic-scale: value + scale share timing and ease; label first.
      const count = (num, target, at, dur, startScale) => {
        const st = { v: 0 };
        num.textContent = "0";
        tl.fromTo(num.parentNode, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, at);
        tl.to(st, { v: target, duration: dur, ease: "power3.out", onUpdate: () => { num.textContent = Math.round(st.v); } }, at);
        tl.fromTo(num, { scale: startScale }, { scale: 1, duration: dur, ease: "power3.out" }, at);
      };

      // Scene 2 — "Eighteen": Hindi splits into 18 tiles, counter 0→18.
      wipe(tilesB, 0.55, 0.48 / tilesB.length);
      count(numB, tilesB.length, 0.55, 1.35, 0.5);
      // Scene 3 — "English's ten": English splits, counter 0→10 (smaller, faster).
      wipe(tilesA, 1.36, 0.035);
      count(numA, tilesA.length, 1.36, 1.0, 0.6);

      // Scene 4 — "Guess first": the stamp slams across the seam (the frame's one overshoot).
      tl.fromTo(stamp, { opacity: 0, scale: 2.6, rotation: -18 }, { opacity: 1, scale: 1, rotation: -7, duration: 0.34, ease: "back.out(2.2)" }, 2.4);

      // Scene 5 — "every chapter": the green block snaps in and holds.
      tl.fromTo(q("#next"), { opacity: 0, x: -60, rotation: -1.5 }, { opacity: 1, x: 0, rotation: -1.5, duration: 0.22, ease: "power3.out" }, 4.2);
    </script>
