      <div data-hf-id="hf-bqt4" id="oB" class="card opt"><div data-hf-id="hf-4pmm" class="tag">B</div><div data-hf-id="hf-q8n0" class="lang">HINDI</div><div data-hf-id="hf-dndm" class="s hi">आपका 12 शेल्फ़ का ऑर्डर शुक्रवार को पहुँचेगा।</div></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["03-predict"] = tl;
      const R = document.querySelector('[data-composition-id="03-predict"]');
      const $ = (s) => R.querySelector(s);
      const q = (s) => R.querySelectorAll(s); // scoped: sibling frames may reuse these ids
      const DUR = 5.638;
      const SHADOW = "14px 14px 0 #231E16", FLAT = "0px 0px 0 #231E16";

      // Scene 1 — kicker snaps in, headline words reveal on a content-length schedule
      tl.fromTo(q("#kick"), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.18, ease: "power3.out" }, 0.05);
      const words = Array.from(R.querySelectorAll("#ask .w"));
      let cum = 0.2;
      const WORDS = words.map((el) => { const start = cum; cum += 0.12 + el.textContent.length * 0.03; return { el, start }; });
      WORDS.forEach(({ el, start }) =>
        tl.fromTo(el, { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "back.out(1.6)" }, start));

      // Scene 2 — cards slide up, then their hard shadow lands
      [["#oA", 0.9], ["#oB", 3.09]].forEach(([id, t]) => {
        tl.fromTo(q(id), { y: 90, opacity: 0, boxShadow: FLAT }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, t);
        tl.fromTo(q(id), { boxShadow: FLAT }, { boxShadow: SHADOW, duration: 0.16, ease: "power2.out", immediateRender: false }, t + 0.32);
      });

      // Scene 3 — the press rises through the faded window; the countdown pops in on 3
      tl.fromTo(q("#press"), { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 3.15);
      tl.fromTo(q("#count"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 3.35);

      // Scene 4 — discrete hard cuts 3 → 2 → 1, reverse-searched each frame, DOM touched only on change
      const SEQUENCE = [{ t: 0, text: "3" }, { t: 4.75, text: "2" }, { t: 5.2, text: "1" }];
      const textAt = (time) => { for (let i = SEQUENCE.length - 1; i >= 0; i--) if (time >= SEQUENCE[i].t) return SEQUENCE[i].text; return "3"; };
      const countEl = $("#count");
      const driver = { t: 0 };
      let last = "";
      tl.to(driver, { t: DUR, duration: DUR, ease: "none", onUpdate: () => {
        const s = textAt(driver.t);
        if (s !== last) { countEl.textContent = s; last = s; }
      } }, 0);

      // each tick: linear press, spring release (adjacent positions keep state continuity)
      [4.75, 5.2].forEach((t) => {
        const PRESS = 0.08;
        tl.to(q("#count"), { scale: 0.88, duration: PRESS, ease: "power1.in" }, t - PRESS);
        tl.to(q("#count"), { scale: 1, duration: 0.3, ease: "back.out(2)" }, t);
      });

      // A and B tags pulse once in turn, done before the cut (cards themselves stay static)
      [["#oA .tag", 4.75], ["#oB .tag", 5.2]].forEach(([sel, t]) => {
        tl.to(q(sel), { scale: 1.18, backgroundColor: "#FFB627", duration: 0.14, ease: "power2.out" }, t);
        tl.to(q(sel), { scale: 1, backgroundColor: "#FBF8F0", duration: 0.24, ease: "power2.inOut" }, t + 0.14);
      });
    </script>
