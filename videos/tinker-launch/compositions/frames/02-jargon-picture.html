    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["02-jargon-picture"] = tl;

      const ON = { backgroundColor: "#231E16", color: "#F2EFE7", opacity: 1, textDecoration: "none" };
      const DONE = { backgroundColor: "#FBF8F0", color: "#231E16", opacity: 0.45, textDecoration: "line-through" };
      const IDLE = { backgroundColor: "#FBF8F0", color: "#231E16", opacity: 1, textDecoration: "none" };

      // Initial state (t=0): only round 1's word shows; card empty.
      gsap.set(["#jp-w2", "#jp-w3", "#jp-g1", "#jp-g2", "#jp-g3", "#jp-p1", "#jp-p2", "#jp-p3"], { autoAlpha: 0 });
      gsap.set(["#jp-s1", "#jp-s2", "#jp-s3"], { strokeDasharray: 1, strokeDashoffset: 1 });
      gsap.set("#jp-ring", { scale: 0, rotation: -3 });
      tl.set("#jp-c1", ON, 0).set(["#jp-c2", "#jp-c3"], IDLE, 0);

      // Crash-in round: strike draws, drawing crashes into the card, text group is shoved, gloss snaps in.
      function crash(n, t) {
        tl.to("#jp-s" + n, { strokeDashoffset: 0, duration: 0.5, ease: "power1.inOut" }, t);
        tl.fromTo("#jp-p" + n,
          { autoAlpha: 0, scale: 0.6, rotation: -8, filter: "blur(6px)" },
          { autoAlpha: 1, scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.9, ease: "expo.out" }, t + 0.1);
        tl.fromTo("#jp-words", { y: 0 }, { y: -12, duration: 0.1, ease: "power2.out" }, t + 0.2)
          .to("#jp-words", { y: 0, duration: 0.7, ease: "power2.out" }, t + 0.3);
        tl.fromTo("#jp-g" + n,
          { autoAlpha: 0, scale: 1.5, rotation: 9 },
          { autoAlpha: 1, scale: 1, rotation: 3, duration: 0.35, ease: "back.out(2)" }, t + 0.5);
      }

      // Hard-cut swap: chips advance, headline swaps, gloss cuts, previous drawing zooms through out.
      function swap(prev, next, t) {
        tl.set("#jp-c" + prev, DONE, t).set("#jp-c" + next, ON, t);
        tl.set(["#jp-w" + prev, "#jp-g" + prev], { autoAlpha: 0 }, t).set("#jp-w" + next, { autoAlpha: 1 }, t);
        tl.to("#jp-p" + prev, { scale: 1.45, autoAlpha: 0, filter: "blur(10px)", duration: 0.35, ease: "power2.in" }, t);
      }

      crash(1, 0.9);   // "looks things up"
      swap(1, 2, 2.8); // "KV"
      crash(2, 4.1);   // "Notes"
      swap(2, 3, 7.3); // "Prompt"
      crash(3, 8.6);   // "email"
      tl.to("#jp-ring", { scale: 1, rotation: -3, duration: 0.6, ease: "back.out(1.7)" }, 9.6); // "tricks": circle the INBOX
      tl.set({}, {}, 10.594);
