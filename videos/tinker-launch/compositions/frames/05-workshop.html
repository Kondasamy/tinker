    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["05-workshop"] = tl;

      // Camera: one world wrapper, T = -offset x S. Opening target = RAG plot (481,525) vs centre (540,540).
      const world = document.getElementById("world-05-workshop");
      const S0 = 2.6, OX = 481 - 540, OY = 525 - 540;
      const cam = { scale: S0, x: -OX * S0, y: -OY * S0 };
      const applyCamera = () => { world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`; };
      applyCamera();

      // Scene 1: 17 card slams in, number counts 1 -> 17 while growing (counting-dynamic-scale)
      tl.fromTo("#num", { opacity: 0, scale: 1.5, rotation: -3 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.35, ease: "power4.out" }, 0.05);
      const counter = document.getElementById("num-05-workshop");
      const state = { v: 1 };
      tl.fromTo(state, { v: 1 }, { v: 17, duration: 2.4, ease: "power3.out", onUpdate: () => { counter.textContent = Math.round(state.v); } }, 0.1);
      tl.fromTo(counter, { scale: 0.5 }, { scale: 1, duration: 2.4, ease: "power3.out" }, 0.1);
      tl.fromTo("#label-05-workshop", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.4);

      // Scene 2: one decelerating zoom-out to the full board (viewport-change), then the camera is locked
      tl.fromTo(cam, { scale: S0, x: -OX * S0, y: -OY * S0 }, { scale: 1, x: 0, y: 0, duration: 2.7, ease: "power3.out", onUpdate: applyCamera }, 1.1);

      // Build / break / fix: RAG, GUARDRAILS, AGENTS pills hop (y -14 -> 0) as an ink ring, then pulse out
      [["#ring-rag", 2.0], ["#ring-guard", 2.55], ["#ring-agents", 3.1]].forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 0, y: -14, scale: 1 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.in" }, t);
        tl.to(sel, { scale: 1.3, opacity: 0, duration: 0.45, ease: "power2.out" }, t + 0.32);
      });

      // Scene 3: "& GROWING" snaps in beside the card and holds
      tl.fromTo("#grow", { opacity: 0, scale: 1.8, rotation: 4 }, { opacity: 1, scale: 1, rotation: 4, duration: 0.35, ease: "back.out(1.8)" }, 3.85);
    </script>
