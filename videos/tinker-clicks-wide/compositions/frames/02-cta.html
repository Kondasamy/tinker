      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // hidden-at-start states
      gsap.set("#cta-name span", { opacity: 0 });
      gsap.set("#cta-chip-free, #cta-chip-nosign, #cta-url", { opacity: 0 });

      // Scene 1 (0.0-0.6): cube springs from zero with a rotation settle

      letters.forEach(function (el, i) {

      // Scene 3 (1.4-2.0): FREE pops at 1.5, NO SIGN-UP at 2.0

      tl.fromTo("#cta-chip-free", { scale: 0.3, rotation: -6 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.2)" }, 1.5);
