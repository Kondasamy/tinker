    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["02-cta"] = tl;

      // hidden-at-start states
      gsap.set("#name span", { opacity: 0 });
      gsap.set("#chip-free, #chip-nosign, #url", { opacity: 0 });

      // Scene 1 (0.0–0.6): cube springs from zero with a rotation settle
      tl.fromTo("#logo", { scale: 0, rotation: -14 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.8)" }, 0.02);

      // TINKER per-letter waterfall: binary opacity, whip up from below
      var letters = gsap.utils.toArray("#name span");
      var rise = [80, 50, 48, 45, 44, 70];
      letters.forEach(function (el, i) {
        var t = 0.1 + i * 0.07;
        tl.set(el, { opacity: 1, y: rise[i] }, t);
        tl.to(el, { y: 0, duration: 0.13, ease: "power4.out" }, t);
      });

      // Scene 2 (0.6–1.4): ink tagline bar wipes open left to right
      tl.fromTo("#tag-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.62);
      tl.fromTo("#tag-text", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power3.out" }, 0.67);

      // Scene 3 (1.4–2.0): FREE pops at 1.5, NO SIGN-UP at 2.0
      tl.set("#chip-free", { opacity: 1 }, 1.5);
      tl.fromTo("#chip-free", { scale: 0.3, rotation: -6 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.2)" }, 1.5);
      tl.set("#chip-nosign", { opacity: 1 }, 2.0);
      tl.fromTo("#chip-nosign", { scale: 0.3, rotation: 6 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.2)" }, 2.0);

      // Scene 4 (2.0–3.5): URL pill fades up at 2.2, then the card holds; no exit
      tl.fromTo("#url", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 2.2);
      tl.set({}, {}, 3.5);
    </script>
