    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["06-workshop"] = tl;

      // Camera: one world wrapper, T = -offset x S. Opening target = RAG plot (481,525) vs centre (540,540).
      const world = document.getElementById("world-06-workshop");
      const S0 = 2.6, OX = 481 - 540, OY = 525 - 540;
      const cam = { scale: S0, x: -OX * S0, y: -OY * S0 };
      const applyCamera = () => { world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`; };
      applyCamera();

      // Scene 1 (0-0.84): four chips stacked centre-frame (xPercent -50 centres any width), board tight behind
      // Scene 2 (0.84-2.42): one decelerating zoom-out; chips fly, staggered, to their spots beside the module pills
      const chips = [["agent", 262], ["evals", 330], ["context", 515], ["finetune", 620]];
      chips.forEach(([id, top], i) => {
        const el = document.getElementById("chip-06-workshop-" + id);
        const left = parseFloat(el.style.left);
        tl.fromTo(el,
          { x: 540 - left, y: 380 + i * 76 - top, xPercent: -50, scale: 1.45, transformOrigin: "50% 50%" },
          { x: 0, y: 0, xPercent: 0, scale: 1, duration: 1.15, ease: "power3.inOut" }, 0.84 + i * 0.1);
      });
      tl.fromTo(cam, { scale: S0, x: -OX * S0, y: -OY * S0 }, { scale: 1, x: 0, y: 0, duration: 1.58, ease: "power3.out", onUpdate: applyCamera }, 0.84);

      // Scene 3 (2.45-3.39): 17 MODULES card slams in, counting 1 -> 17 while growing (counting-dynamic-scale)
      tl.fromTo("#num", { opacity: 0, scale: 1.5, rotation: -3 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.3, ease: "power4.out" }, 2.45);
      const counter = document.getElementById("num-06-workshop");
      const state = { v: 1 };
      tl.fromTo(state, { v: 1 }, { v: 17, duration: 0.9, ease: "power3.out", onUpdate: () => { counter.textContent = Math.round(state.v); } }, 2.47);
      tl.fromTo(counter, { scale: 0.5 }, { scale: 1, duration: 0.9, ease: "power3.out" }, 2.47);
      tl.fromTo("#label-06-workshop", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.6);

      // Scene 4 (3.39-5.03): "& GROWING" snaps in; hold, board locked
      tl.fromTo("#grow", { opacity: 0, scale: 1.8, rotation: 4 }, { opacity: 1, scale: 1, rotation: 4, duration: 0.35, ease: "back.out(1.8)" }, 3.39);
    </script>
