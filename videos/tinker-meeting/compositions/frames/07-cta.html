      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      var t = 0.08;
      letters.forEach(function (el, i) {

        tl.to(el, { y: 0, duration: specs[i][1], ease: "power4.out" }, t);
        t += specs[i][1] - 2 * F - 0.04;

      tl.to("#you-b", { scale: 1, duration: 0.2, ease: "power2.in" }, 1.32);
