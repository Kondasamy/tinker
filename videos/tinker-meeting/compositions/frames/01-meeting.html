    <div data-hf-id="hf-9ah1" class="clip stage" data-start="0" data-duration="3.94" data-track-index="1">
      <div data-hf-id="hf-6ex2" class="chrome"><span data-hf-id="hf-9rj2">Tinker</span><span data-hf-id="hf-n9mj" class="pill">01 / 07</span></div>
<div data-hf-id="hf-re5o" class="card chat"><div data-hf-id="hf-z992" class="head"><span data-hf-id="hf-fqc9">#REFUNDS-SYNC &middot; 4 PEOPLE</span><span data-hf-id="hf-mvju" class="live" id="01-meeting-live">&#9679; LIVE</span></div><div data-hf-id="hf-7lh1" class="row" style="top:110px"><div data-hf-id="hf-2lp8" class="av" style="background:#76A0E2">AN</div><div data-hf-id="hf-fme3" class="msg"><div data-hf-id="hf-m4xa" class="who">ANALYST</div><div data-hf-id="hf-0vqy" class="txt">Refund tickets keep piling up.</div></div></div><div data-hf-id="hf-jbs4" class="row" style="top:270px"><div data-hf-id="hf-dzub" class="av" style="background:#71B693">EL</div><div data-hf-id="hf-z5gb" class="msg"><div data-hf-id="hf-d0s2" class="who">ENG LEAD</div><div data-hf-id="hf-dn43" class="txt">We&rsquo;re drowning in them.</div></div></div><div data-hf-id="hf-6r3n" class="row" id="01-meeting-pm" style="top:430px"><div data-hf-id="hf-e04k" class="av" style="background:#FFB627">PM</div><div data-hf-id="hf-yr5a" class="msg"><div data-hf-id="hf-55br" class="who">PM</div><div data-hf-id="hf-tsph" class="txt" style="white-space:nowrap"><span data-hf-id="hf-i28h" id="01-meeting-text"></span><span data-hf-id="hf-1r09" id="01-meeting-caret"></span></div><div data-hf-id="hf-yzmg" class="react" id="01-meeting-react">+1 &middot; 3</div></div></div><div data-hf-id="hf-58q3" class="typing" id="01-meeting-typing">ENG LEAD IS TYPING<b data-hf-id="hf-xujp"></b><b data-hf-id="hf-ey49"></b><b data-hf-id="hf-g51c"></b></div></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["01-meeting"] = tl;

      const D = 3.94;
      const FULL = "Let’s just add an agent for refunds.";
      const SENT_HTML = 'Let&rsquo;s just add an <span class="hl0">agent</span> for refunds.';
      const T_TYPE = 0.4, T_AGENT = 1.78, T_SEND = 2.05;
      // Scene 2: keystrokes up to "agent" (lands on the VO's "agent" at 1.78s), then two quick bursts.
      const SEQ = [{ t: 0, n: 0 }];
      const head = "Let’s just add an agent".length;
      for (let i = 1; i <= head; i++) SEQ.push({ t: T_TYPE + (i * (T_AGENT - T_TYPE)) / head, n: i });
      SEQ.push({ t: 1.86, n: "Let’s just add an agent for".length });
      SEQ.push({ t: 1.93, n: FULL.length });
      // Scene 3: the +1 count ticks 1 -> 2 -> 3.
      const COUNT = [{ t: 0, n: 1 }, { t: 2.5, n: 2 }, { t: 2.8, n: 3 }];
      const at = (arr, t) => { for (let i = arr.length - 1; i >= 0; i--) if (t >= arr[i].t) return arr[i].n; return arr[0].n; };

      const textEl = document.getElementById("01-meeting-text");
      const caretEl = document.getElementById("01-meeting-caret");
      const reactEl = document.getElementById("01-meeting-react");
      const dots = document.querySelectorAll('[id="01-meeting-typing"] b');
      let last = "";
      const driver = { t: 0 };
      tl.to(driver, {
        t: D, duration: D, ease: "none",
        onUpdate: () => {
          const t = driver.t;
          let key;
          if (t >= T_SEND) {
            key = "sent";
            if (last !== key) { textEl.innerHTML = SENT_HTML; textEl.className = ""; }
            caretEl.style.opacity = "0";
          } else {
            key = String(at(SEQ, t));
            if (last !== key) { textEl.textContent = FULL.slice(0, at(SEQ, t)); textEl.className = "pending"; }
            // blink while idle, solid while keys land
            const typing = t >= T_TYPE && t < 1.95;
            caretEl.style.opacity = typing || Math.sin(t * Math.PI * 2 / 0.6) > 0 ? "1" : "0";
          }
          last = key;
          reactEl.innerHTML = "+1 &middot; " + at(COUNT, t);
          // typing dots step one at a time, then rest static for the handoff
          const step = t >= 3.15 && t < 3.75 ? Math.floor((t - 3.15) / 0.15) % 3 : -1;
          dots.forEach((d, i) => { d.style.transform = i === step ? "translateY(-7px)" : "none"; });
        },
      }, 0);

      // Scene 1: the PM row arrives while the meeting is already going.
      tl.fromTo('[id="01-meeting-live"]', { opacity: 0.35 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0);
      tl.fromTo('[id="01-meeting-pm"]', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.08);
      // Send settle: a small press on the row as it goes out.
      tl.fromTo('[id="01-meeting-pm"] .txt', { y: 0 }, { y: -4, duration: 0.08, ease: "power1.out" }, T_SEND);
      tl.to('[id="01-meeting-pm"] .txt', { y: 0, duration: 0.18, ease: "back.out(3)" }, T_SEND + 0.08);
      // Scene 3: the +1 chip pops in, then the next person starts typing.
      tl.fromTo(reactEl, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 2.2);
      tl.fromTo('[id="01-meeting-typing"]', { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 3.0);
    </script>
