# monthly, grouped: one PR per ecosystem keeps upkeep to a glance
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups:
      all: { patterns: ['*'] }
    # astro check refuses TypeScript 7; lift this when Astro supports it
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  # keeps the SHA-pinned actions in .github/workflows/ci.yml current
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ['*'] }
